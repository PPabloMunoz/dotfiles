###############################################################################
# TokyoNight Night - minimalist
###############################################################################

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color*:RGB"

set -g @tn_bg "#16161e"
set -g @tn_bg_main "#1a1b26"
set -g @tn_highlight "#292e42"
set -g @tn_fg "#c0caf5"
set -g @tn_muted "#565f89"
set -g @tn_blue "#7aa2f7"

# Status bar
set -g status-style "bg=#{@tn_bg},fg=#{@tn_fg}"
set -g status-left-length 40
set -g status-right-length 40

set -g status-left "#{?client_prefix,#[bg=#{@tn_blue}]#[fg=#{@tn_bg}],#[bg=#{@tn_highlight}]#[fg=#{@tn_fg}]} #S "
set -g status-right "#[fg=#{@tn_muted}] %H:%M %d-%b "

setw -g window-status-format "#[fg=#{@tn_muted},bg=#{@tn_bg}] #I:#W "
setw -g window-status-current-format "#[fg=#{@tn_bg},bg=#{@tn_blue}] #I:#W "
setw -g window-status-separator ""
set -g status-justify left

# Pane borders
set -g pane-border-style "fg=#{@tn_highlight}"
set -g pane-active-border-style "fg=#{@tn_blue}"

# Messages
set -g message-style "fg=#{@tn_fg},bg=#{@tn_bg}"
set -g message-command-style "fg=#{@tn_fg},bg=#{@tn_bg}"
